[package]
name = "offbywon-quic-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "=0.13.2"
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
